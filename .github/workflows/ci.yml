name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # Weekly too: the image's Debian packages change with Debian's updates, and
  # its build checks them against THIRD_PARTY.md.
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...

  e2e:
    name: End-to-end demo
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Allow rootless Podman
        # Ubuntu 24.04 restricts unprivileged user namespaces with AppArmor.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Tools
        run: |
          podman --version
          for t in jq unzip openssl rsync; do command -v $t >/dev/null || missing="$missing $t"; done
          [ -z "$missing" ] || { sudo apt-get update && sudo apt-get install -y $missing; }
      - name: Build the container image
        # Fails when the Debian packages or clerk's crate licences in it differ
        # from THIRD_PARTY.md (deploy/third-party.sh).
        run: podman build -t localhost/shelf:latest .
      - name: Run the end-to-end test
        run: test/e2e.sh

  browser:
    name: Browser tests (Chromium, Firefox)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test/browser/package-lock.json
      - name: grind's web page, for the office tests
        # The same build the container image includes (Containerfile).
        run: |
          docker create --name grind-web ghcr.io/fwilhe2/grind-web:latest >/dev/null
          docker cp grind-web:/usr/share/grind/web "$RUNNER_TEMP/grind-web"
          echo "GRIND_WEB=$RUNNER_TEMP/grind-web" >> "$GITHUB_ENV"
      - name: Install Playwright and its browsers
        working-directory: test/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox
      - name: An audio server
        # Firefox can't play any audio without one (MEDIA_ERR_DECODE); with no
        # sound card, PulseAudio gives it a silent sink.
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio --daemonize --exit-idle-time=-1
          pactl info | grep -i '^default sink'
      - name: Run the browser tests
        working-directory: test/browser
        run: npx playwright test
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            test/browser/playwright-report/
            test/browser/test-results/
          retention-days: 14

  # The image, for amd64 and arm64 (Raspberry Pi), each built natively: the
  # Rust and Debian stages run for the target architecture, and under QEMU
  # clerk's build takes far too long. Built on pull requests too, to find
  # arm64-only breakage; pushed to ghcr.io only from main (pushes, the weekly
  # run, manual runs) and v* tags, after all the tests passed.
  image:
    name: Container image (${{ matrix.arch }})
    needs: [test, e2e, browser]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      PUSH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
      - id: build
        name: Build${{ env.PUSH == 'true' && ' and push' || '' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          # Without a tag: the manifest job below tags both architectures together.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ env.PUSH }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max
      - name: Keep the digest
        if: env.PUSH == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v7
        if: env.PUSH == 'true'
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Push the image
    needs: image
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # latest: main, and its weekly rebuild. sha-<commit>: to pin one
          # build. 1.2.3 and 1.2: a tag v1.2.3.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Tag both architectures together and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "--tag=" + .' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for d in *; do sources+=("$IMAGE@sha256:$d"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
      - name: Show the image
        run: |
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          echo "Pushed \`$IMAGE\` with tags: $(jq -r '.tags | join(", ")' <<<"$DOCKER_METADATA_OUTPUT_JSON")" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERSION: ${{ steps.meta.outputs.version }}
