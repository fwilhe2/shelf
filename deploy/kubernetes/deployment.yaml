apiVersion: apps/v1
kind: Deployment
metadata:
  name: shelf
spec:
  # One shelf per config: it is the only writer of config.json, and the
  # volumes are ReadWriteOnce. Recreate, so the old pod is gone before the new
  # one mounts them.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: shelf
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shelf
        app.kubernetes.io/component: server
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        # "nonroot" in the distroless image.
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Makes the volumes writable for it; OnRootMismatch, so a big data
        # volume is not walked through on every start.
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: shelf
          image: ghcr.io/fwilhe2/shelf
          args: [serve]
          ports:
            # Whatever "listen" says in config.json; README.md creates it with :8080.
            - name: http
              containerPort: 8080
          # TCP, not HTTP: it stays right when `shelf cert` turns on HTTPS.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
          securityContext:
            # As in deploy/shelf.container: shelf only writes to /config and /data.
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: shelf-config
        - name: data
          persistentVolumeClaim:
            claimName: shelf-data
