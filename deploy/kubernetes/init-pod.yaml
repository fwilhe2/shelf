# Run once, before the first start (README.md): `shelf init` writes
# /config/config.json with the first user and the share "files" -> /data.
# Not part of kustomization.yaml.
apiVersion: v1
kind: Pod
metadata:
  name: shelf-init
  namespace: shelf
  labels:
    app.kubernetes.io/name: shelf
    app.kubernetes.io/component: init
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  enableServiceLinks: false
  # On the server's node, if it is already scheduled (ReadWriteOnce volumes).
  affinity:
    podAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: shelf
                app.kubernetes.io/component: server
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: init
      image: ghcr.io/fwilhe2/shelf:latest
      args: [init, -data, /data, -listen, ":8080"]
      stdin: true
      stdinOnce: true
      tty: true
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: config
          mountPath: /config
        - name: data
          mountPath: /data
  volumes:
    - name: config
      persistentVolumeClaim:
        claimName: shelf-config
    - name: data
      persistentVolumeClaim:
        claimName: shelf-data
