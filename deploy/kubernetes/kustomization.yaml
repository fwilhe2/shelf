# shelf on Kubernetes:  kubectl apply -k deploy/kubernetes
# First start and day-to-day use: deploy/kubernetes/README.md.
#
# To pin the image to a release instead of :latest, change newTag (or run
# `kustomize edit set image ghcr.io/fwilhe2/shelf:v1.2.3`).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shelf
labels:
  - pairs:
      app.kubernetes.io/name: shelf
    includeSelectors: false
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - index-cronjob.yaml
images:
  - name: ghcr.io/fwilhe2/shelf
    newTag: latest
