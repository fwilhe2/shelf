<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shelf</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='13' width='18' height='7' rx='2'/%3E%3Cpath d='M5 13 7 5h10l2 8M7 16.5h.01'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f5f6f8; --panel: #fff; --text: #1c2230; --muted: #687082; --border: #e2e5ea;
    --hover: #f0f3f8; --accent: #2563eb; --accent-ink: #fff; --danger: #d92d20; --bar: #e7eaef;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101317; --panel: #181c22; --text: #e5e8ed; --muted: #949cab; --border: #2a3039;
      --hover: #1f252d; --accent: #5b8fff; --accent-ink: #0b1020; --danger: #ff6b5e; --bar: #2a3039;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input { font: inherit; color: inherit; }
  svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8;
          stroke-linecap: round; stroke-linejoin: round; }
  [hidden] { display: none !important; }

  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: var(--panel);
           border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 17px;
           color: var(--text); text-decoration: none; }
  .brand svg { color: var(--accent); width: 22px; height: 22px; }
  .spacer { flex: 1; }
  .who { color: var(--muted); font-size: 14px; }
  .search { flex: 1; max-width: 420px; min-width: 0; position: relative; margin: 0; }
  .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .search input { width: 100%; padding: 7px 11px 7px 36px; border: 1px solid var(--border); border-radius: 8px;
                  background: var(--bg); }
  .search + .spacer { flex: 0 1 auto; }

  .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border);
         background: var(--panel); border-radius: 8px; padding: 7px 12px; cursor: pointer; white-space: nowrap; }
  .btn:hover:not(:disabled) { background: var(--hover); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
  .btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  .icon-btn { border: 0; background: none; padding: 6px; border-radius: 6px; cursor: pointer;
              color: var(--muted); display: inline-flex; }
  .icon-btn:hover { background: var(--hover); color: var(--text); }

  main { max-width: 1100px; margin: 0 auto; padding: 20px; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 16px; }
  .crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; font-size: 17px; min-width: 0; }
  .crumbs a { color: var(--text); text-decoration: none; padding: 3px 6px; border-radius: 6px; }
  .crumbs a:hover { background: var(--hover); }
  .crumbs a:last-child { font-weight: 600; }
  .crumbs .sep { color: var(--muted); }
  .badge { font-size: 12px; color: var(--muted); border: 1px solid var(--border); border-radius: 99px;
           padding: 1px 8px; margin-left: 6px; }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--border); }
  th { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: var(--hover); }
  td.name { width: 100%; max-width: 0; }
  td.name a { display: flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; }
  td.name a span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.name svg.dir { color: var(--accent); }
  td.name svg.file { color: var(--muted); }
  td.num { white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
  td.actions { white-space: nowrap; text-align: right; padding: 4px 8px; }
  .empty { padding: 48px 20px; text-align: center; color: var(--muted); }

  .hits-note { color: var(--muted); font-size: 14px; margin: 0 0 10px; }
  .hit { display: block; padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--text);
         text-decoration: none; min-width: 0; }
  .hit:last-child { border-bottom: 0; }
  .hit:hover { background: var(--hover); }
  .hit-name { display: flex; align-items: center; gap: 10px; font-weight: 550; }
  .hit-name span, .hit-dir { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hit-name svg { color: var(--muted); }
  .hit-dir { color: var(--muted); font-size: 13px; margin: 2px 0 0 28px; }
  .hit-ctx { font-size: 14px; margin: 4px 0 0 28px; overflow-wrap: anywhere; }
  mark { background: color-mix(in srgb, var(--accent) 28%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }

  .shares { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .share { display: block; background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
           padding: 16px; color: var(--text); text-decoration: none; }
  .share:hover { border-color: var(--accent); }
  .share h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; font-size: 16px; }
  .share h3 svg { color: var(--accent); width: 22px; height: 22px; }
  .meter { height: 6px; background: var(--bar); border-radius: 99px; overflow: hidden; }
  .meter > div { height: 100%; background: var(--accent); }
  .share small { display: block; margin-top: 8px; color: var(--muted); }

  .login { max-width: 340px; margin: 12vh auto; background: var(--panel); border: 1px solid var(--border);
           border-radius: 14px; padding: 28px; }
  .login h1 { display: flex; align-items: center; gap: 8px; margin: 0 0 20px; font-size: 22px; }
  .login h1 svg { color: var(--accent); width: 26px; height: 26px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  input[type=text], input[type=password] { width: 100%; padding: 9px 11px; border: 1px solid var(--border);
           border-radius: 8px; background: var(--bg); }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .login .btn { width: 100%; justify-content: center; margin-top: 20px; padding: 10px; }
  .error { color: var(--danger); font-size: 14px; margin-top: 12px; min-height: 1em; }

  dialog { border: 1px solid var(--border); border-radius: 14px; background: var(--panel); color: var(--text);
           padding: 22px; width: min(460px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgb(0 0 0 / .35); }
  dialog h2 { margin: 0 0 10px; font-size: 18px; }
  dialog p { margin: 0 0 8px; color: var(--muted); }
  dialog .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  dialog code { display: block; padding: 8px 10px; background: var(--bg); border: 1px solid var(--border);
                border-radius: 8px; font-size: 13px; word-break: break-all; margin: 4px 0 12px; }
  dialog dt { font-weight: 600; margin-top: 10px; }
  dialog dd { margin: 2px 0 0; color: var(--muted); font-size: 14px; }

  .drop { position: fixed; inset: 0; background: color-mix(in srgb, var(--accent) 14%, transparent);
          border: 3px dashed var(--accent); display: grid; place-items: center; font-size: 22px;
          font-weight: 600; color: var(--accent); pointer-events: none; z-index: 20; }

  .uploads { position: fixed; right: 16px; bottom: 16px; width: min(360px, calc(100vw - 32px));
             background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
             box-shadow: 0 8px 30px rgb(0 0 0 / .15); z-index: 15; max-height: 50vh; overflow: auto; }
  .uploads h4 { margin: 0; padding: 10px 14px; font-size: 14px; border-bottom: 1px solid var(--border);
                display: flex; align-items: center; }
  .up { padding: 8px 14px; font-size: 13px; }
  .up .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 4px; }
  .up.err .n { color: var(--danger); }

  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text);
           color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 30; max-width: 90vw; }
  .toast.err { background: var(--danger); color: #fff; }

  /* the file viewer: a full-window layer over the file list */
  html.viewing { overflow: hidden; }
  .viewer { position: fixed; inset: 0; z-index: 25; display: flex; flex-direction: column;
            background: var(--bg); overscroll-behavior: contain; }
  .v-bar { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: var(--panel);
           border-bottom: 1px solid var(--border); padding-top: max(8px, env(safe-area-inset-top)); }
  .v-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
             font-weight: 600; margin-left: 4px; }
  .viewer:focus { outline: none; }
  .v-count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap;
             padding: 0 4px; }
  .v-tools { display: contents; }
  .icon-btn:disabled { opacity: .35; cursor: default; background: none; }
  .v-body { flex: 1; min-height: 0; position: relative; display: grid; place-items: center; overflow: hidden;
            grid-template: minmax(0, 1fr) / minmax(0, 1fr); } /* a definite cell, so a big picture fits in it */
  .v-body.image, .v-body.video { background: #000; }
  .v-body img, .v-body video { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .v-body img { touch-action: pan-y pinch-zoom; }
  .v-audio { display: flex; flex-direction: column; align-items: center; gap: 18px; width: min(560px, 90%); }
  .v-audio svg { width: 64px; height: 64px; color: var(--accent); stroke-width: 1.2; }
  .v-audio audio { width: 100%; }
  .v-body iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--panel); }
  .v-body iframe.opening { visibility: hidden; }
  .v-text { position: absolute; inset: 0; margin: 0; overflow: auto; padding: 16px 20px; background: var(--panel);
            font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap;
            overflow-wrap: anywhere; tab-size: 4; }
  .v-pdf { position: absolute; inset: 0; overflow: auto; background: var(--bar); outline: 0; }
  .v-wait { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 14px; color: var(--muted); background: var(--bg); }
  .v-body.image .v-wait, .v-body.video .v-wait { background: #000; }
  .spinner { width: 30px; height: 30px; border: 3px solid var(--border); border-top-color: var(--accent);
             border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .v-msg { text-align: center; color: var(--muted); padding: 24px; max-width: 480px; }
  .v-msg p { margin: 0 0 16px; }
  .v-body.image .v-msg, .v-body.video .v-msg { color: #c8ced8; }

  .about-list { margin: 8px 0 0; padding: 0; list-style: none; }
  .about-list li { padding: 8px 0; border-top: 1px solid var(--border); font-size: 14px; }
  .about-list small { display: block; color: var(--muted); }
  dialog a { color: var(--accent); }

  @media (max-width: 640px) {
    header { padding: 10px 12px; }
    main { padding: 12px; }
    .who, .hide-sm, .mod, #v-raw, .v-count { display: none; }
    th, td { padding: 9px 10px; }
  }
</style>
</head>
<body>

<div id="login" class="login" hidden>
  <h1><svg class="i" viewBox="0 0 24 24"><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M5 13 7 5h10l2 8M7 16.5h.01"/></svg>shelf</h1>
  <form id="login-form">
    <label for="u">Username</label>
    <input id="u" type="text" autocomplete="username" autocapitalize="none" required>
    <label for="p">Password</label>
    <input id="p" type="password" autocomplete="current-password" required>
    <button class="btn primary" type="submit">Log in</button>
    <div class="error" id="login-error"></div>
  </form>
</div>

<div id="app" hidden>
  <header>
    <a class="brand" href="#/"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M5 13 7 5h10l2 8M7 16.5h.01"/></svg>shelf</a>
    <form class="search" id="search-form" role="search" hidden><span data-icon="search"></span><input type="search" id="q" placeholder="Search in files" aria-label="Search in files" enterkeyhint="search" autocomplete="off"></form>
    <div class="spacer"></div>
    <span class="who" id="who"></span>
    <button class="btn" id="connect-btn"><span data-icon="link"></span><span class="hide-sm">Connect a drive</span></button>
    <button class="icon-btn" id="about-btn" title="About shelf"><span data-icon="info"></span></button>
    <button class="icon-btn" id="logout-btn" title="Log out"><span data-icon="logout"></span></button>
  </header>
  <main>
    <div class="bar">
      <nav class="crumbs" id="crumbs"></nav>
      <div class="spacer"></div>
      <div id="tools" class="bar" style="margin:0">
        <button class="btn" id="mkdir-btn"><span data-icon="folderPlus"></span><span class="hide-sm">New folder</span></button>
        <button class="btn" id="zip-btn" title="Download this folder as zip"><span data-icon="download"></span><span class="hide-sm">Download all</span></button>
        <button class="btn" id="upfolder-btn"><span data-icon="folderUp"></span><span class="hide-sm">Upload folder</span></button>
        <button class="btn primary" id="upload-btn"><span data-icon="upload"></span>Upload</button>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>

<input type="file" id="file-input" multiple hidden>
<input type="file" id="folder-input" webkitdirectory hidden>
<div class="drop" id="drop" hidden>Drop files to upload</div>
<div class="uploads" id="uploads" hidden><h4><span id="up-title">Uploads</span><span class="spacer"></span><button class="icon-btn" id="up-close" title="Close"><span data-icon="x"></span></button></h4><div id="up-list"></div></div>
<div class="viewer" id="viewer" tabindex="-1" hidden>
  <div class="v-bar">
    <button class="icon-btn" id="v-close" title="Close (Esc)"><span data-icon="back"></span></button>
    <span class="v-title" id="v-title"></span>
    <span class="v-tools" id="v-tools"></span>
    <span class="v-count" id="v-count"></span>
    <button class="icon-btn" id="v-prev" title="Previous (←)"><span data-icon="prev"></span></button>
    <button class="icon-btn" id="v-next" title="Next (→)"><span data-icon="next"></span></button>
    <a class="icon-btn" id="v-raw" title="Open the file itself in a new tab" target="_blank" rel="noopener"><span data-icon="external"></span></a>
    <a class="icon-btn" id="v-download" title="Download"><span data-icon="download"></span></a>
  </div>
  <div class="v-body" id="v-body"></div>
</div>
<dialog id="dlg"></dialog>

<script>
"use strict";
const ICONS = {
  folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  file: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
  doc: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
  drive: '<rect x="3" y="13" width="18" height="7" rx="2"/><path d="M5 13 7 5h10l2 8M7 16.5h.01"/>',
  download: '<path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/>',
  upload: '<path d="M12 16V5m0 0-4 4m4-4 4 4M5 20h14"/>',
  folderPlus: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM12 10v6M9 13h6"/>',
  folderUp: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM12 16v-6m-3 3 3-3 3 3"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  logout: '<path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/>',
  link: '<path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/>',
  x: '<path d="M6 6l12 12M18 6 6 18"/>',
  back: '<path d="M19 12H5m0 0 6-6m-6 6 6 6"/>',
  prev: '<path d="m15 6-6 6 6 6"/>',
  next: '<path d="m9 6 6 6-6 6"/>',
  external: '<path d="M14 4h6v6M20 4l-9 9M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
  image: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-9 9"/>',
  video: '<rect x="3" y="5" width="14" height="14" rx="2"/><path d="m17 10 4-2v8l-4-2"/>',
  audio: '<path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/>',
  zoomIn: '<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4M11 8v6M8 11h6"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
  zoomOut: '<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4M8 11h6"/>',
};
function icon(name, cls = '') {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('viewBox', '0 0 24 24');
  s.setAttribute('class', 'i ' + cls);
  s.innerHTML = ICONS[name];
  return s;
}
document.querySelectorAll('[data-icon]').forEach(e => e.replaceWith(icon(e.dataset.icon)));

const $ = id => document.getElementById(id);
function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'class') e.className = v;
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k);
  return e;
}

// ---------- paths & formatting
const enc = p => p.split('/').map(encodeURIComponent).join('/');
const dav = p => '/dav' + enc(p);
const join = (a, b) => (a.endsWith('/') ? a : a + '/') + b;
// The address is #/share/folder, or #/share/folder?view=name while the viewer shows a file,
// or #/?q=words for a search.
function parseHash() {
  const h = location.hash.slice(1), q = h.indexOf('?');
  const params = new URLSearchParams(q < 0 ? '' : h.slice(q + 1));
  return {
    path: decodeURIComponent(q < 0 ? h : h.slice(0, q)) || '/',
    view: params.get('view'),
    q: params.get('q'),
  };
}
const current = () => parseHash().path;
const viewHash = (dir, name) => '#' + enc(dir) + '?view=' + encodeURIComponent(name);

function size(n) {
  if (n < 1024) return n + ' B';
  const u = ['KB', 'MB', 'GB', 'TB', 'PB'];
  let i = -1;
  do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
  return n.toFixed(n < 10 ? 1 : 0) + ' ' + u[i];
}
function when(iso) {
  const d = new Date(iso), now = new Date();
  return d.toDateString() === now.toDateString()
    ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    : d.toLocaleDateString([], { year: 'numeric', month: 'short', day: 'numeric' });
}

let toastTimer;
function toast(msg, err = false) {
  document.querySelector('.toast')?.remove();
  const t = el('div', { class: 'toast' + (err ? ' err' : '') }, msg);
  document.body.append(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), err ? 6000 : 3000);
}

// ---------- server calls
const HDR = { 'X-Requested-With': 'shelf' };
async function api(url, opts = {}) {
  const r = await fetch(url, { ...opts, headers: { ...HDR, ...(opts.headers || {}) } });
  if (r.status === 401) { showLogin(); throw new Error('Please log in'); }
  if (!r.ok) {
    let msg = r.status + ' ' + r.statusText;
    try { msg = (await r.json()).error || msg; } catch { }
    throw new Error(msg);
  }
  return r;
}
async function davReq(method, p, headers = {}, okStatus = []) {
  const r = await fetch(dav(p), { method, headers: { ...HDR, ...headers } });
  if (r.status === 401) { showLogin(); throw new Error('Please log in'); }
  if (!r.ok && !okStatus.includes(r.status)) {
    const why = { 403: 'not allowed', 404: 'not found', 405: 'already exists', 409: 'parent folder missing', 412: 'name already taken', 507: 'disk full' }[r.status];
    throw new Error(`${method} failed: ${why || r.status + ' ' + r.statusText}`);
  }
  return r;
}
function putFile(p, file, onProgress) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open('PUT', dav(p));
    x.setRequestHeader('X-Requested-With', 'shelf');
    x.upload.onprogress = e => e.lengthComputable && onProgress(e.loaded / e.total);
    x.onload = () => x.status < 300 ? resolve() : reject(new Error(x.status === 507 ? 'disk full' : x.status + ' ' + x.statusText));
    x.onerror = () => reject(new Error('network error'));
    x.send(file);
  });
}

// ---------- dialogs
function dialog({ title, message, input, ok = 'OK', danger = false, cancel = true, body }) {
  const dlg = $('dlg');
  return new Promise(resolve => {
    const field = input != null ? el('input', { type: 'text', value: input }) : null;
    const done = v => { dlg.close(); resolve(v); };
    const form = el('form', { method: 'dialog', onsubmit: e => { e.preventDefault(); done(field ? field.value.trim() : true); } },
      el('h2', {}, title),
      message && el('p', {}, message),
      body,
      field,
      el('div', { class: 'row' },
        cancel && el('button', { type: 'button', class: 'btn', onclick: () => done(null) }, 'Cancel'),
        el('button', { type: 'submit', class: 'btn ' + (danger ? 'danger' : 'primary') }, ok)));
    dlg.replaceChildren(form);
    dlg.onclose = () => resolve(null);
    dlg.showModal();
    if (field) { field.focus(); const dot = input.lastIndexOf('.'); field.setSelectionRange(0, dot > 0 ? dot : input.length); }
  });
}

// ---------- views
let state = { path: '/', entries: [], readOnly: true };
let officeExts = []; // file extensions the office page (/office/) opens; empty when it is off
let searchOn = false; // full-text search with clerk (docs/search.md)

async function whoami(r) {
  const me = await r.json();
  $('who').textContent = me.user;
  officeExts = me.office || [];
  searchOn = !!me.search;
  $('search-form').hidden = !searchOn;
}
// Office documents open in grind's page, which fetches them from WebDAV (docs/office.md).
const isOffice = name => officeExts.some(x => name.toLowerCase().endsWith(x));

// What the viewer can show, by file extension. Anything else is a plain download link.
const KINDS = {
  image: 'jpg jpeg jfif png apng gif webp avif svg bmp ico',
  video: 'mp4 m4v webm mov ogv mkv',
  audio: 'mp3 m4a aac ogg oga opus wav flac weba',
  pdf: 'pdf',
  text: 'txt text md markdown log csv tsv json jsonl xml yaml yml toml ini conf cfg properties env ' +
        'sh bash zsh fish ps1 bat py rb pl php go rs c h cc cpp hpp java kt swift cs js mjs ts tsx jsx ' +
        'css scss html htm vue svelte sql diff patch srt vtt nfo gitignore dockerfile containerfile',
};
const EXT_KIND = new Map(Object.entries(KINDS).flatMap(([k, exts]) => exts.split(' ').map(x => [x, k])));
function kindOf(name) {
  if (isOffice(name)) return 'office';
  const n = name.toLowerCase();
  return EXT_KIND.get(n.slice(n.lastIndexOf('.') + 1)) || null;
}
const KIND_ICON = { image: 'image', video: 'video', audio: 'audio', pdf: 'doc', text: 'doc', office: 'doc' };

function showLogin() {
  $('app').hidden = true;
  $('login').hidden = false;
  $('u').focus();
}

async function load(p = current()) {
  try {
    if (p === '/') {
      const shares = await (await api('/api/shares')).json();
      state = { path: '/', entries: [], readOnly: true };
      renderShares(shares);
    } else {
      const d = await (await api('/api/list?path=' + encodeURIComponent(p))).json();
      state = { path: d.path, entries: d.entries, readOnly: d.read_only };
      renderList();
    }
    $('login').hidden = true;
    $('app').hidden = false;
    return true;
  } catch (e) {
    if (e.message !== 'Please log in') toast(e.message, true);
    return false;
  }
}

function renderCrumbs() {
  const parts = state.path.split('/').filter(Boolean);
  const nav = $('crumbs');
  nav.replaceChildren(el('a', { href: '#/' }, 'Shares'));
  let p = '';
  for (const part of parts) {
    p += '/' + part;
    nav.append(el('span', { class: 'sep' }, '/'), el('a', { href: '#' + enc(p) }, part));
  }
  if (parts.length && state.readOnly) nav.append(el('span', { class: 'badge' }, 'read-only'));
  const atRoot = state.path === '/';
  $('tools').hidden = atRoot;
  for (const id of ['mkdir-btn', 'upload-btn', 'upfolder-btn']) $(id).disabled = state.readOnly;
}

function renderShares(shares) {
  renderCrumbs();
  if (!shares.length) {
    $('view').replaceChildren(el('div', { class: 'panel empty' }, 'No shares available for you yet. Add one with: shelf share add NAME DIR'));
    return;
  }
  $('view').replaceChildren(el('div', { class: 'shares' }, shares.map(s => {
    const used = s.total ? (s.total - s.free) / s.total : 0;
    return el('a', { class: 'share', href: '#' + enc('/' + s.name) },
      el('h3', {}, icon('drive'), s.name, s.read_only && el('span', { class: 'badge' }, 'read-only')),
      s.available

function renderList() {
  renderCrumbs();
  const ro = state.readOnly;
  if (!state.entries.length) {
    $('view').replaceChildren(el('div', { class: 'panel empty' }, ro ? 'This folder is empty.' : 'This folder is empty. Drop files here or press Upload.'));

// ---------- search (docs/search.md)
// clerk marks where the words are in a text with [brackets].
// ponytail: a bracket that is in the text itself is taken for a mark too.
const marked = text => text.split(/\[([^\]]*)\]/).map((t, i) => i % 2 ? el('mark', {}, t) : t);

async function search(q) {
  $('q').value = q;
  state = { path: '/', entries: [], readOnly: true };
  renderCrumbs();
  $('crumbs').append(el('span', { class: 'sep' }, '/'), el('a', { href: location.hash }, 'Search'));
  $('view').replaceChildren(el('div', { class: 'panel empty' }, 'Searching…'));
  $('login').hidden = true;
  $('app').hidden = false;
  let d;
  try {
    d = await (await api('/api/search?q=' + encodeURIComponent(q))).json();
  } catch (e) {
    if (e.message !== 'Please log in') $('view').replaceChildren(el('div', { class: 'panel empty' }, e.message));
    return;
  }
  if (parseHash().q !== q) return; // a newer search is under way
  if (!d.results.length) {
    $('view').replaceChildren(el('div', { class: 'panel empty' }, `Nothing found for “${q}”.`));
    return;
  }
  const hits = d.results.map(h => {
    const cut = h.path.lastIndexOf('/'), dir = h.path.slice(0, cut), name = h.path.slice(cut + 1);
    const kind = kindOf(name);
    const open = ev => { // like openViewer: closing the viewer comes back to the results
      if (ev.button !== 0 || ev.ctrlKey || ev.metaKey || ev.shiftKey || ev.altKey) return;
      ev.preventDefault();
      history.pushState({ viewer: true }, '', viewHash(dir, name));
      route();
    };
    return el('a', kind ? { class: 'hit', href: viewHash(dir, name), onclick: open }
                        : { class: 'hit', href: dav(h.path), target: '_blank', rel: 'noopener' },
      el('div', { class: 'hit-name' }, icon(kind ? KIND_ICON[kind] : 'file'), el('span', {}, name)),
      el('div', { class: 'hit-dir' }, dir.slice(1)),
      h.context && el('div', { class: 'hit-ctx' }, marked(h.context)));
  });
  $('view').replaceChildren(
    el('p', { class: 'hits-note' }, d.truncated
      ? `The first ${hits.length} files found; another word finds fewer.`
      : `${hits.length} ${hits.length === 1 ? 'file' : 'files'} found`),
    el('div', { class: 'panel' }, hits));
}

const badName = n => !n || n === '.' || n === '..' || n.includes('/');

  const name = await dialog({ title: 'New folder', input: '', ok: 'Create' });

  try { await davReq('MKCOL', join(state.path, name)); load(); } catch (e) { toast(e.message, true); }

  try {

// ---------- viewer
// Files open in a full-window layer over the list. Its address is #folder?view=name, so the
// browser's Back button closes it and a link to it can be opened in a new tab.
const PDFJS_VERSION = '6.5.438';
const PDFJS = `/vendor/pdfjs-${PDFJS_VERSION}/`;
const viewer = { name: null, token: null, cleanup: null, guard: null };
const viewables = () => state.entries.filter(e => !e.dir && kindOf(e.name));

function openViewer(ev, name) {
  if (ev.button !== 0 || ev.ctrlKey || ev.metaKey || ev.shiftKey || ev.altKey) return; // new tab etc.
  ev.preventDefault();
  history.pushState({ viewer: true }, '', viewHash(state.path, name));
  showViewer(name);
}

// closeViewer goes back to the folder; route() asks first when there are unsaved changes.
function closeViewer() {
  if (history.state?.viewer) history.back();
  else location.hash = enc(state.path);
}

async function step(d) {
  const list = viewables(), i = list.findIndex(e => e.name === viewer.name);
  const to = list[i + d];
  if (!to || !(await leaveOk())) return;
  history.replaceState(history.state, '', viewHash(state.path, to.name));
  showViewer(to.name);
}

async function leaveOk() {
  return !viewer.guard || await viewer.guard();
}

function teardown() {
  try { viewer.cleanup?.(); } catch { }
  Object.assign(viewer, { name: null, token: null, cleanup: null, guard: null });
  $('v-body').replaceChildren();
  $('v-tools').replaceChildren();
}

function hideViewer() {
  if ($('viewer').hidden) return;
  teardown();
  $('viewer').hidden = true;
  document.documentElement.classList.remove('viewing');
}

function showViewer(name) {
  if (viewer.name === name && !$('viewer').hidden) return;
  const e = state.entries.find(x => !x.dir && x.name === name);
  const kind = e && kindOf(e.name);
  if (!kind) {
    hideViewer();
    toast(e ? `“${name}” can't be shown here` : `“${name}” is not in this folder`, true);
    history.replaceState(null, '', '#' + enc(state.path));
    return;
  }
  teardown();
  const token = {};
  Object.assign(viewer, { name, token });
  const p = join(state.path, name), list = viewables(), i = list.indexOf(e);
  $('v-title').textContent = $('v-title').title = name;
  $('v-count').textContent = list.length > 1 ? `${i + 1} / ${list.length}` : '';
  for (const [id, off] of [['v-prev', i <= 0], ['v-next', i >= list.length - 1]]) {
    $(id).disabled = off;
    $(id).hidden = list.length < 2;
  }
  $('v-download').href = $('v-raw').href = dav(p);
  $('v-download').download = name;
  $('v-raw').hidden = kind === 'office' || kind === 'text';
  const body = $('v-body');
  body.className = 'v-body ' + kind;
  $('viewer').hidden = false;
  document.documentElement.classList.add('viewing');
  $('viewer').focus();
  VIEW[kind](body, p, e, () => viewer.token === token);
  // Fetch the neighbouring pictures now, so flipping through a folder doesn't wait.
  for (const n of [list[i - 1], list[i + 1]]) if (n && kindOf(n.name) === 'image') new Image().src = dav(join(state.path, n.name));
}

const waiting = text => el('div', { class: 'v-wait' }, el('div', { class: 'spinner' }), text);
function failed(body, msg, p) {
  body.replaceChildren(el('div', { class: 'v-msg' }, el('p', {}, msg),
    el('a', { class: 'btn', href: dav(p), download: p.slice(p.lastIndexOf('/') + 1) }, icon('download'), 'Download')));
}
const toolBtn = (name, title, onclick) => el('button', { class: 'icon-btn', title, onclick }, icon(name));

const VIEW = {
  image(body, p) {
    const img = el('img', { src: dav(p), alt: '' });
    img.onerror = () => failed(body, "This picture can't be shown in the browser.", p);
    body.append(img);
    // Swipe left and right on a phone, like in a photo app.
    let x0 = null;
    img.addEventListener('touchstart', e => { x0 = e.touches.length === 1 ? e.touches[0].clientX : null; }, { passive: true });
    img.addEventListener('touchend', e => {
      if (x0 == null || visualViewport?.scale > 1.01) return;
      const dx = e.changedTouches[0].clientX - x0;
      if (Math.abs(dx) > 60) step(dx < 0 ? 1 : -1);
    });
  },

  video(body, p) {
    const v = el('video', { src: dav(p), controls: true, autoplay: true, playsinline: true, preload: 'metadata' });
    v.onerror = () => failed(body, "This browser can't play this video. Download it to play it with a video player.", p);
    body.append(v);
  },

  audio(body, p, e) {
    const a = el('audio', { src: dav(p), controls: true, autoplay: true, preload: 'metadata' });
    a.onerror = () => failed(body, "This browser can't play this file.", p);
    body.append(el('div', { class: 'v-audio' }, icon('audio'), el('div', {}, e.name), a));
  },

  async text(body, p, e, live) {
    if (e.size > 5 << 20) return failed(body, 'This file is too large to show here.', p);
    body.append(waiting('Loading…'));
    try {
      const text = await (await davReq('GET', p)).text();
      if (live()) body.replaceChildren(el('pre', { class: 'v-text', tabindex: '0' }, text));
    } catch (err) { if (live()) failed(body, err.message, p); }
  },

  async pdf(body, p, e, live) {
    const wait = waiting('Opening…');
    body.append(wait);
    let task;
    viewer.cleanup = () => task?.destroy();
    try {
      const { lib, ui } = await pdfjs();
      if (!live()) return;
      // PDFViewer wants its container in the page, absolutely positioned, before it starts.
      const container = el('div', { class: 'v-pdf', tabindex: '0' }, el('div', { class: 'pdfViewer' }));
      body.prepend(container);
      const eventBus = new ui.EventBus();
      const links = new ui.PDFLinkService({ eventBus, externalLinkTarget: ui.LinkTarget.BLANK, externalLinkRel: 'noopener noreferrer nofollow' });
      const pv = new ui.PDFViewer({ container, eventBus, linkService: links });
      links.setViewer(pv);
      task = lib.getDocument({
        url: new URL(dav(p), location.href).href, httpHeaders: HDR,
        cMapUrl: PDFJS + 'cmaps/', cMapPacked: true, standardFontDataUrl: PDFJS + 'standard_fonts/',
        wasmUrl: PDFJS + 'wasm/', iccUrl: PDFJS + 'iccs/',
      });
      const doc = await task.promise;
      if (!live()) return;
      const page = el('span', { class: 'v-count' });
      const showPage = () => { page.textContent = `p. ${pv.currentPageNumber} of ${doc.numPages}`; };
      eventBus.on('pagesinit', () => {
        pv.currentScaleValue = innerWidth < 700 ? 'page-width' : 'auto';
        showPage();
        wait.remove();
        container.focus();
      });
      eventBus.on('pagechanging', showPage);
      pv.setDocument(doc);
      links.setDocument(doc);
      $('v-tools').replaceChildren(page,
        toolBtn('zoomOut', 'Zoom out', () => pv.decreaseScale()),
        toolBtn('zoomIn', 'Zoom in', () => pv.increaseScale()));
    } catch (err) {
      if (!live()) return;
      failed(body, err?.name === 'PasswordException' ? 'This PDF is protected with a password.' : `This PDF can't be shown: ${err?.message || err}`, p);
    }
  },

  // grind's page (docs/office.md) tells its parent what happens by postMessage: grind:opened,
  // grind:failed, and grind:dirty whenever unsaved edits come or go. The frame stays behind
  // the spinner until the document is open, so it appears in one piece.
  office(body, p, e) {
    const frame = el('iframe', { class: 'opening', src: '/office/?doc=..' + dav(p), title: e.name });
    const wait = waiting('Opening…');
    body.append(frame, wait);
    let dirty = false;
    const onMessage = m => {
      if (m.source !== frame.contentWindow || m.origin !== location.origin) return;
      switch (m.data?.type) {
        case 'grind:opened': wait.remove(); frame.classList.remove('opening'); frame.contentWindow.focus(); break;
        case 'grind:failed': failed(body, m.data.message, p); break;
        case 'grind:dirty': dirty = !!m.data.dirty; break;
      }
    };
    addEventListener('message', onMessage);
    viewer.cleanup = () => removeEventListener('message', onMessage);
    // Edits stay in the page; removing the frame would drop them without a beforeunload.
    viewer.guard = async () => !dirty || !!await dialog({
      title: 'Discard your changes?', ok: 'Discard', danger: true,
      message: `Changes to “${e.name}” are not saved on the share. To keep them, use Save in the document first: it downloads a copy.`,
    });
  },
};

// pdfjs loads PDF.js (web/vendor, Apache-2.0) the first time a PDF is opened.
let pdfjsLoading;
function pdfjs() {
  return pdfjsLoading ??= (async () => {
    const css = el('link', { rel: 'stylesheet', href: PDFJS + 'legacy/web/pdf_viewer.css' });
    const cssLoaded = new Promise(res => { css.onload = css.onerror = res; });
    document.head.append(css);
    const lib = await import(PDFJS + 'legacy/build/pdf.min.mjs');
    lib.GlobalWorkerOptions.workerSrc = PDFJS + 'legacy/build/pdf.worker.min.mjs';
    globalThis.pdfjsLib = lib; // pdf_viewer.mjs takes the library from here
    const ui = await import(PDFJS + 'legacy/web/pdf_viewer.mjs');
    await cssLoaded;
    return { lib, ui };
  })().catch(err => { pdfjsLoading = null; throw err; });
}

// route shows what the address names: a folder, and maybe a file over it.
async function route() {
  const { path, view, q } = parseHash();
  if (viewer.name && (view !== viewer.name || path !== state.path) && !(await leaveOk())) {
    history.pushState({ viewer: true }, '', viewHash(state.path, viewer.name));
    return;
  }
  if (q != null) {
    hideViewer();
    listed = false;
    return search(q);
  }
  if (!view) hideViewer();
  if ((path !== state.path || !view || !listed) && !(await load(path))) return hideViewer();
  listed = true;
  if (view) showViewer(view);
}
let listed = false;

// ---------- uploads
async function upload(items) {
  if (state.readOnly || state.path === '/' || !items.length) return;
  const base = state.path;
  const existing = new Set(state.entries.map(e => e.name));
  const clashes = new Set(items.map(i => i.rel.split('/')[0]).filter(n => existing.has(n)));
  if (clashes.size) {
    const ok = await dialog({
      title: 'Replace existing items?',
      message: `${clashes.size} item(s) already exist in this folder: ${[...clashes].slice(0, 5).join(', ')}${clashes.size > 5 ? ', …' : ''}. Files with the same name will be overwritten.`,
      ok: 'Replace', danger: true,
    });
    if (!ok) return;
  }

  const files = items.filter(i => i.file);
  const box = $('uploads'), list = $('up-list');
  box.hidden = false;
  let done = 0, failed = 0;
  const title = () => { $('up-title').textContent = done + failed < files.length ? `Uploading ${done + 1} of ${files.length}` : (failed ? `${failed} upload(s) failed` : `${done} file(s) uploaded`); };
  title();

  const made = new Set();
  const ensureDir = async dir => {
    if (dir === base || made.has(dir)) return;
    await ensureDir(dir.replace(/\/[^/]+$/, '') || '/');
    made.add(dir);
    await davReq('MKCOL', dir, {}, [405]); // 405: exists already
  };
  try {
    for (const it of items.filter(i => !i.file)) await ensureDir(join(base, it.rel));
  } catch (e) { toast(e.message, true); }

  for (const it of files) {
    const bar = el('div', { style: 'width:0%' });
    const row = el('div', { class: 'up' }, el('div', { class: 'n' }, it.rel), el('div', { class: 'meter' }, bar));
    list.prepend(row);
    const target = join(base, it.rel);
    try {
      await ensureDir(target.replace(/\/[^/]+$/, ''));
      await putFile(target, it.file, f => { bar.style.width = (f * 100).toFixed(1) + '%'; });
      bar.style.width = '100%';
      done++;
    } catch (e) {
      row.classList.add('err');
      row.firstChild.textContent = `${it.rel} — ${e.message}`;
      failed++;
    }
    title();
  }
  if (current() === base) load();
}

async function itemsFromDrop(dt) {
  // webkitGetAsEntry must be called synchronously, before the first await.
  const roots = [...dt.items].map(i => i.webkitGetAsEntry?.()).filter(Boolean);
  if (!roots.length) return [...dt.files].map(f => ({ rel: f.name, file: f }));
  const out = [];
  async function walk(entry, prefix) {
    if (entry.isFile) {
      out.push({ rel: prefix + entry.name, file: await new Promise((res, rej) => entry.file(res, rej)) });
    } else if (entry.isDirectory) {
      out.push({ rel: prefix + entry.name });
      const reader = entry.createReader();
      for (;;) {
        const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
        if (!batch.length) break;
        for (const e of batch) await walk(e, prefix + entry.name + '/');
      }
    }
  }
  for (const r of roots) await walk(r, '');
  return out;
}

// ---------- wiring
$('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  $('login-error').textContent = '';
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: $('u').value.trim(), password: $('p').value }) });
    if (!r.ok) throw new Error((await r.json()).error);
    await whoami(await fetch('/api/me', { headers: HDR }));
    $('p').value = '';
    route();
  } catch (err) { $('login-error').textContent = err.message || 'Login failed'; }
});
$('logout-btn').onclick = async () => { await fetch('/api/logout', { method: 'POST' }); showLogin(); };
$('connect-btn').onclick = connect;
$('about-btn').onclick = about;
$('v-close').onclick = closeViewer;
$('v-prev').onclick = () => step(-1);
$('v-next').onclick = () => step(1);
document.addEventListener('keydown', e => {
  if ($('viewer').hidden || $('dlg').open || e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === 'Escape') { e.preventDefault(); closeViewer(); return; }
  // Arrows flip through pictures and videos; in a PDF or a text they scroll.
  const flips = ['image', 'video', 'audio'].includes(kindOf(viewer.name || '')) && !(e.target instanceof HTMLMediaElement);
  if (flips && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { e.preventDefault(); step(e.key === 'ArrowLeft' ? -1 : 1); }
});
$('search-form').onsubmit = e => {
  e.preventDefault();
  const q = $('q').value.trim(), h = '#/?q=' + encodeURIComponent(q);
  if (!q) return;
  if (location.hash === h) route();
  else location.hash = h;
};
$('mkdir-btn').onclick = mkdir;
$('zip-btn').onclick = () => { location.href = '/api/zip?path=' + encodeURIComponent(state.path); };
$('upload-btn').onclick = () => $('file-input').click();
$('upfolder-btn').onclick = () => $('folder-input').click();
$('up-close').onclick = () => { $('uploads').hidden = true; $('up-list').replaceChildren(); };
for (const id of ['file-input', 'folder-input']) {
  $(id).addEventListener('change', e => {
    const items = [...e.target.files].map(f => ({ rel: f.webkitRelativePath || f.name, file: f }));
    e.target.value = '';
    upload(items);
  });
}

let dragDepth = 0;
const canDrop = e => $('viewer').hidden && !state.readOnly && state.path !== '/' && e.dataTransfer?.types.includes('Files');
window.addEventListener('dragenter', e => { if (canDrop(e)) { e.preventDefault(); dragDepth++; $('drop').hidden = false; } });
window.addEventListener('dragover', e => { if (canDrop(e)) e.preventDefault(); });
window.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('drop').hidden = true; } });
window.addEventListener('drop', async e => {
  if (!canDrop(e)) return;
  e.preventDefault();
  dragDepth = 0;
  $('drop').hidden = true;
  upload(await itemsFromDrop(e.dataTransfer));
});

window.addEventListener('hashchange', route);
(async () => {
  try {
    const r = await fetch('/api/me', { headers: HDR });
    if (!r.ok) return showLogin();
    await whoami(r);
    route();
  } catch { showLogin(); }
})();
</script>
